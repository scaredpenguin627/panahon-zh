name: Build Philippine weather for Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'breezy-weather/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: breezy-weather
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"'
      - name: Build APK and run the integration tests
        run: ./gradlew :app:assembleBasicDebug :app:testBasicDebugUnitTest --tests '*Panahon*' --tests '*Philippine*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: panahon-zh-arm64-debug
          path: breezy-weather/app/build/outputs/apk/basic/debug/*arm64-v8a*.apk
          if-no-files-found: error
