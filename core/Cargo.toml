[package]
name = "panahon-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Data and API boundary for the Chinese PANaHON reimplementation"
license = "MIT OR Apache-2.0"

[features]
default = []
network = ["dep:ureq"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", optional = true, default-features = false, features = ["json", "tls"] }

[dev-dependencies]
pretty_assertions = "1.4"


