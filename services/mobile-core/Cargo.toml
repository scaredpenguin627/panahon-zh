[package]
name = "panahon-mobile-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Shared snapshot and dynamic-weather profile logic for the Android client"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
jni = ["dep:jni"]

[dependencies]
jni = { version = "0.22", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

