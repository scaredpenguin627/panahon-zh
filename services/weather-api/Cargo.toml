[package]
name = "panahon-weather-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Rust service layer for public Philippine weather data"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["json", "tls", "gzip"] }

[dev-dependencies]
pretty_assertions = "1.4"

